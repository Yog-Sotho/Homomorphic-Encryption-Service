services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    # Reachable only from this host (nginx); never publish the API directly.
    ports:
      - "127.0.0.1:8080:8080"
    # The backend drains running jobs for up to 30 s after SIGTERM.
    stop_grace_period: 40s
    environment:
      - DATABASE_URL=sqlite:///usr/src/he-backend/data/he_saas.db
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in .env}
      # Browser origins besides APP_BASE_URL's own (usually none).
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      # Requests reach the backend through nginx on the host and the frontend
      # container (Docker networks are in 172.16.0.0/12), so their
      # X-Forwarded-For hops are believed; everyone else's are not.
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-127.0.0.1/32,::1/128,172.16.0.0/12}
      - SERVER_ADDR=0.0.0.0:8080
      - RUST_LOG=info
      # Users' uploaded TFHE server keys (~60 MB each) live next to the database.
      - KEY_STORE_DIR=/usr/src/he-backend/data/keys
      - MAX_KEYS_PER_USER=${MAX_KEYS_PER_USER:-2}
      # Decompressed keys kept in RAM, ~180 MB each.
      - KEY_CACHE_CAPACITY=${KEY_CACHE_CAPACITY:-2}
      # Job ciphertexts (inputs and results), kept for JOB_RETENTION_DAYS.
      - JOB_STORE_DIR=/usr/src/he-backend/data/jobs
      - HE_WORKERS=${HE_WORKERS:-2}
      - MAX_QUEUED_JOBS=${MAX_QUEUED_JOBS:-1000}
      - JOB_RETENTION_DAYS=${JOB_RETENTION_DAYS:-7}
      - APP_BASE_URL=${APP_BASE_URL:-https://gibliz.taile5d4a8.ts.net}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - FROM_EMAIL=${FROM_EMAIL:-noreply@heaas.local}
      - DAILY_COMPUTE_QUOTA=${DAILY_COMPUTE_QUOTA:-100}
    volumes:
      - ./data:/usr/src/he-backend/data
  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - BACKEND_URL=http://backend:8080
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm dev --host"
    depends_on:
      - backend

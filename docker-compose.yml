# Both services run as non-root users with a read-only root filesystem, no
# Linux capabilities and no privilege escalation. State lives in the named
# volume `heaas-data` (see docs/self-hosting.md "Backups" to back it up and to migrate from
# the old ./data bind mount).
x-hardened: &hardened
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped

services:
  backend:
    <<: *hardened
    build:
      context: .
      dockerfile: Dockerfile
    # Reachable only from this host (nginx); never publish the API directly.
    ports:
      - "127.0.0.1:8080:8080"
    # The backend drains running jobs for up to 30 s after SIGTERM.
    stop_grace_period: 40s
    environment:
      # DATABASE_URL, KEY_STORE_DIR and JOB_STORE_DIR point into /data (image defaults).
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in .env}
      # Browser origins besides APP_BASE_URL's own (usually none).
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      # Requests reach the backend through nginx on the host and the frontend
      # container (Docker networks are in 172.16.0.0/12), so their
      # X-Forwarded-For hops are believed; everyone else's are not.
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-127.0.0.1/32,::1/128,172.16.0.0/12}
      - SERVER_ADDR=0.0.0.0:8080
      - RUST_LOG=${RUST_LOG:-info}
      # JSON lines on stdout; `pretty` for reading by eye.
      - LOG_FORMAT=${LOG_FORMAT:-json}
      # Enables GET /metrics (Prometheus) with this bearer token; scrape the
      # backend on 127.0.0.1:8080, nginx does not proxy it.
      - METRICS_TOKEN=${METRICS_TOKEN:-}
      - MAX_KEYS_PER_USER=${MAX_KEYS_PER_USER:-2}
      # Decompressed keys kept in RAM, ~180 MB each.
      - KEY_CACHE_CAPACITY=${KEY_CACHE_CAPACITY:-2}
      # Job ciphertexts (inputs and results) are kept for JOB_RETENTION_DAYS.
      - HE_WORKERS=${HE_WORKERS:-2}
      - MAX_QUEUED_JOBS=${MAX_QUEUED_JOBS:-1000}
      - JOB_RETENTION_DAYS=${JOB_RETENTION_DAYS:-7}
      # The public URL of the site (emailed links and OAuth callbacks use it).
      - APP_BASE_URL=${APP_BASE_URL:?APP_BASE_URL must be set in .env, e.g. https://heaas.example.com}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - SMTP_HOST=${SMTP_HOST:-}
      # starttls (port 587), implicit (465) or none; SMTP_PORT defaults to match.
      - SMTP_TLS=${SMTP_TLS:-starttls}
      - SMTP_PORT=${SMTP_PORT:-}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - FROM_EMAIL=${FROM_EMAIL:-}
      - ACCESS_TOKEN_TTL_SECS=${ACCESS_TOKEN_TTL_SECS:-}
      - SESSION_TTL_DAYS=${SESSION_TTL_DAYS:-}
      - VERIFY_LINK_TTL_HOURS=${VERIFY_LINK_TTL_HOURS:-}
      - RESET_LINK_TTL_MINUTES=${RESET_LINK_TTL_MINUTES:-}
      - DAILY_COMPUTE_QUOTA=${DAILY_COMPUTE_QUOTA:-100}
    volumes:
      # Database, users' server keys (~60 MB each) and job ciphertexts.
      - heaas-data:/data
      # Where `./backup.sh` has the backend write its backups.
      - ${BACKUP_DIR:-/var/backups/heaas}:/backups
  frontend:
    <<: *hardened
    build:
      context: frontend
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  heaas-data:
    name: heaas-data

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "18080:8080"
    environment:
      - DATABASE_URL=sqlite:///usr/src/he-backend/data/he_saas.db
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in .env}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000}
      - SERVER_ADDR=0.0.0.0:8080
      - RUST_LOG=info
      - HE_POOL_SIZE=${HE_POOL_SIZE:-2}
      - APP_BASE_URL=${APP_BASE_URL:-https://gibliz.taile5d4a8.ts.net}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - FROM_EMAIL=${FROM_EMAIL:-noreply@heaas.local}
      - DAILY_COMPUTE_QUOTA=${DAILY_COMPUTE_QUOTA:-100}
    volumes:
      - ./data:/usr/src/he-backend/data
  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://backend:8080
    command: sh -c "npm install && npm run dev -- --host"
    depends_on:
      - backend

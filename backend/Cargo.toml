[package]
name = "he-backend"
version = "0.3.0"
edition = "2021"

[dependencies]
actix-web = "4.9"
actix-cors = "0.7"
actix-web-lab = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio-native-tls", "sqlite", "chrono", "uuid"] }
chrono = { version = "0.4", features = ["serde"] }
jsonwebtoken = "9"
bcrypt = "0.15"
uuid = { version = "1", features = ["v4", "serde"] }
env_logger = "0.11"
log = "0.4"
dotenvy = "0.15"
thiserror = "1"
base64 = "0.22"
lazy_static = "1.5"
dashmap = "6"
bincode = "1"
num_cpus = "1"

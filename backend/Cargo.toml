[package]
name = "he-backend"
version = "0.3.0"
edition = "2021"

[dependencies]
actix-web = "4.9"
actix-cors = "0.7"
actix-web-lab = "0.26"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio-native-tls", "sqlite", "chrono", "uuid"] }
chrono = { version = "0.4", features = ["serde"] }
jsonwebtoken = "9"
bcrypt = "0.15"
uuid = { version = "1", features = ["v4", "serde"] }
env_logger = "0.11"
log = "0.4"
dotenvy = "0.15"
thiserror = "1"
base64 = "0.22"
dashmap = "6"
bincode = "1"
num_cpus = "1"
tfhe = { version = "~1.3", features = ["integer"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
url = "2"
lettre = { version = "0.11", features = ["smtp-transport", "tokio1-native-tls", "builder"] }
sha2 = "0.10"

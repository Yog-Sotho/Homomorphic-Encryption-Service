[package]
name = "he-backend"
version = "0.3.0"
publish = false
edition = "2021"
rust-version = "1.91.1"

[dependencies]
# HTTP/2 and WebSockets are unused (nginx terminates clients and proxies HTTP/1.1);
# disabling them drops h2 from the tree.
actix-web = { version = "4.9", default-features = false, features = ["macros", "compress-brotli", "compress-gzip", "compress-zstd", "cookies", "unicode", "compat"] }
actix-cors = "0.7"
actix-web-lab = "0.26"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "sqlite", "chrono", "uuid", "macros", "migrate"] }
chrono = { version = "0.4", features = ["serde"] }
jsonwebtoken = "9"
bcrypt = "0.15"
uuid = { version = "1", features = ["v4", "serde"] }
env_logger = "0.11"
log = "0.4"
dotenvy = "0.15"
thiserror = "1"
base64 = "0.22"
dashmap = "6"
num_cpus = "1"
tfhe = { version = "1.8", features = ["integer"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
url = "2"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1-rustls-tls", "builder", "hostname", "pool"] }
sha2 = "0.10"

[dev-dependencies]
# Already in the tree via actix-web; named here for the test service request type.
actix-http = "3"

# TFHE-rs is unusably slow without optimisation, so dependencies are built
# release-like in dev/test while our own crate stays fast to compile. Debuginfo,
# debug assertions and overflow checks in tfhe-fft's SIMD code turn a <1 min
# compile into >30 min, so they are off for dependencies.
[profile.dev.package."*"]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
codegen-units = 16

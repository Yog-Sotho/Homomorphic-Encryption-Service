[package]
name = "he-backend"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# HTTP/2 and WebSockets are unused (nginx terminates clients and proxies HTTP/1.1);
# disabling them drops h2 from the tree.
actix-web = { version = "4.9", default-features = false, features = ["macros", "compress-brotli", "compress-gzip", "compress-zstd", "cookies", "unicode", "compat"] }
actix-cors = "0.7"
actix-web-lab = "0.29"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
sqlx.workspace = true
chrono.workspace = true
# jsonwebtoken 10+ needs exactly one crypto backend; without one every sign/verify
# panics. aws-lc-rs has no open advisories (rust_crypto pulls in `rsa`, RUSTSEC-2023-0071).
# PEM support is not needed: tokens are HS256 with a shared secret.
jsonwebtoken = { version = "11", default-features = false, features = ["aws_lc_rs"] }
bcrypt = "0.19"
uuid.workspace = true
# Structured logs (JSON in production); `log` records from libraries are bridged in.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# Prometheus text exposition only; protobuf is not needed.
prometheus = { version = "0.14", default-features = false }
dotenvy = "0.15"
base64.workspace = true
tfhe.workspace = true
reqwest.workspace = true
url = "2"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1-rustls-tls", "builder", "hostname", "pool"] }
sha2.workspace = true
heaas-core = { workspace = true, features = ["sqlx", "openapi"] }
utoipa.workspace = true
# Session and OAuth hardening: keyed rate limits, trusted-proxy CIDRs, HMAC-signed
# OAuth cookies with keys derived from JWT_SECRET (HKDF), OS randomness for tokens.
governor = "0.10"
ipnet = "2"
hmac = "0.12"
hkdf = "0.12"
subtle = "2"
getrandom = "0.4"

[dev-dependencies]
# Already in the tree via actix-web; named here for the test service request type.
actix-http = "3"
# Stands in for the Google and GitHub OAuth endpoints.
wiremock.workspace = true
# The SDK's own end-to-end test runs against a live server built here.
heaas-sdk.workspace = true

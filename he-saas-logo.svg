<svg width="400" height="120" viewBox="0 0 400 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Modern Tech Gradient: Deep Indigo to Electric Purple -->
    <linearGradient id="techGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9333EA;stop-opacity:1" />
    </linearGradient>
    
    <!-- Subtle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shape: Abstract Shield/Data Block -->
  <path d="M20 20 L80 20 L80 80 L50 100 L20 80 Z" 
        fill="url(#techGrad)" 
        stroke="#1F2937" 
        stroke-width="3" 
        filter="url(#glow)" />

  <!-- Inner Icon: The "Homomorphic" Link (Two interlocking rings representing data + computation) -->
  <circle cx="50" cy="55" r="15" fill="none" stroke="#FFFFFF" stroke-width="4" opacity="0.9"/>
  <circle cx="50" cy="55" r="8" fill="#FFFFFF" opacity="0.9"/>
  
  <!-- Small Data Nodes around the lock -->
  <circle cx="35" cy="40" r="3" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="65" cy="40" r="3" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="35" cy="70" r="3" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="65" cy="70" r="3" fill="#FFFFFF" opacity="0.7"/>

  <!-- Text: HEaaS -->
  <text x="95" y="65" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="48" font-weight="800" fill="#1F2937" letter-spacing="-1">HEaaS</text>
  
  <!-- Tagline -->
  <text x="95" y="85" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#6B7280" letter-spacing="1">HOMOMORPHIC ENCRYPTION SERVICE</text>
</svg>
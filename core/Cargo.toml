[package]
name = "heaas-core"
description = "What HE Engine clients and the server must agree on: TFHE parameters, operations and API types."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Database row mapping, for the server.
sqlx = ["dep:sqlx"]
# OpenAPI schemas, for the server's API description.
openapi = ["dep:utoipa"]

[dependencies]
tfhe.workspace = true
serde.workspace = true
chrono.workspace = true
uuid.workspace = true
sqlx = { workspace = true, optional = true }
utoipa = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true

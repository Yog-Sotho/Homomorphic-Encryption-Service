<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="t d">
  <title id="t">How the HE Engine works</title>
  <desc id="d">Your device encrypts the numbers with a secret key that never leaves it. The server computes directly on the encrypted values using only an evaluation key. Your device decrypts the encrypted result.</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#6366f1"/>
    </marker>
    <symbol id="lock" viewBox="0 0 24 24">
      <path d="M7 11V8a5 5 0 0 1 10 0v3" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
      <rect x="4.5" y="10.5" width="15" height="11" rx="2.5" fill="currentColor"/>
    </symbol>
    <symbol id="key" viewBox="0 0 24 24">
      <circle cx="7.5" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="2.4"/>
      <path d="M12 12h10M18 12v4M21.5 12v3" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
    </symbol>
  </defs>

  <rect width="1200" height="430" rx="20" fill="#ffffff"/>
  <rect x="1" y="1" width="1198" height="428" rx="19" fill="none" stroke="#e5e7eb" stroke-width="2"/>

  <g font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
    <!-- Column headers -->
    <g font-size="15" font-weight="700" fill="#6b7280" letter-spacing="1.5">
      <text x="190" y="52" text-anchor="middle">1 · ON YOUR DEVICE</text>
      <text x="600" y="52" text-anchor="middle">2 · ON THE SERVER</text>
      <text x="1010" y="52" text-anchor="middle">3 · ON YOUR DEVICE</text>
    </g>

    <!-- 1. Encrypt -->
    <rect x="40" y="76" width="300" height="250" rx="16" fill="#f5f7ff" stroke="#c7d2fe" stroke-width="2"/>
    <text x="190" y="116" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">Encrypt</text>
    <g font-size="20" font-weight="600" fill="#111827">
      <text x="98" y="170" text-anchor="middle">300</text>
      <text x="282" y="170" text-anchor="middle">300</text>
    </g>
    <g fill="none" stroke="#9ca3af" stroke-width="2" stroke-dasharray="4 4">
      <path d="M98 182 v26"/><path d="M282 182 v26"/>
    </g>
    <g>
      <rect x="58" y="214" width="80" height="40" rx="9" fill="url(#accent)"/>
      <rect x="242" y="214" width="80" height="40" rx="9" fill="url(#accent)"/>
      <use href="#lock" x="86" y="222" width="24" height="24" color="#ffffff"/>
      <use href="#lock" x="270" y="222" width="24" height="24" color="#ffffff"/>
    </g>
    <use href="#key" x="148" y="148" width="84" height="40" color="#4f46e5"/>
    <text x="190" y="290" text-anchor="middle" font-size="15" fill="#374151">Your secret key stays here.</text>
    <text x="190" y="311" text-anchor="middle" font-size="15" fill="#374151">Only ciphertexts are sent.</text>

    <!-- 2. Compute -->
    <rect x="450" y="76" width="300" height="250" rx="16" fill="#111827"/>
    <text x="600" y="116" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">Compute</text>
    <rect x="490" y="150" width="70" height="40" rx="9" fill="url(#accent)"/>
    <rect x="640" y="150" width="70" height="40" rx="9" fill="url(#accent)"/>
    <use href="#lock" x="513" y="158" width="24" height="24" color="#ffffff"/>
    <use href="#lock" x="663" y="158" width="24" height="24" color="#ffffff"/>
    <text x="600" y="180" text-anchor="middle" font-size="26" font-weight="700" fill="#c7d2fe">×</text>
    <path d="M600 198 v18" stroke="#6b7280" stroke-width="2"/>
    <rect x="565" y="222" width="70" height="40" rx="9" fill="url(#accent)"/>
    <use href="#lock" x="588" y="230" width="24" height="24" color="#ffffff"/>
    <text x="600" y="290" text-anchor="middle" font-size="15" fill="#d1d5db">Works on encrypted values only.</text>
    <text x="600" y="311" text-anchor="middle" font-size="15" fill="#d1d5db">It cannot see 300, 300 or the result.</text>

    <!-- 3. Decrypt -->
    <rect x="860" y="76" width="300" height="250" rx="16" fill="#f5f7ff" stroke="#c7d2fe" stroke-width="2"/>
    <text x="1010" y="116" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">Decrypt</text>
    <rect x="975" y="150" width="70" height="40" rx="9" fill="url(#accent)"/>
    <use href="#lock" x="998" y="158" width="24" height="24" color="#ffffff"/>
    <path d="M1010 198 v18" stroke="#9ca3af" stroke-width="2" stroke-dasharray="4 4"/>
    <text x="1010" y="252" text-anchor="middle" font-size="30" font-weight="800" fill="#111827">24464</text>
    <text x="1010" y="290" text-anchor="middle" font-size="15" fill="#374151">Only your key can read it.</text>
    <text x="1010" y="311" text-anchor="middle" font-size="15" fill="#374151">300 × 300 = 90000 mod 65536</text>

    <!-- Flow -->
    <path d="M346 201 H442" stroke="#6366f1" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <path d="M756 201 H852" stroke="#6366f1" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <text x="394" y="190" text-anchor="middle" font-size="13" fill="#6b7280">send</text>
    <text x="804" y="190" text-anchor="middle" font-size="13" fill="#6b7280">return</text>

    <!-- Footer -->
    <text x="600" y="380" text-anchor="middle" font-size="16" fill="#4b5563">The server holds an evaluation key: enough to compute on your data, never enough to decrypt it.</text>
  </g>
</svg>

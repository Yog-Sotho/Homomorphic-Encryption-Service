<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">Homomorphic Encryption Engine</title>
  <desc id="desc">Compute on encrypted data. Your keys never leave your device.</desc>
  <defs>

version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      rust-minor:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm-minor:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories: [/, /frontend]
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # The documentation site's MkDocs and Material (requirements-docs.txt).
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    ignore:
      # MkDocs 2 drops the plugin and theme system Material needs.
      - dependency-name: mkdocs
        update-types: ["version-update:semver-major"]

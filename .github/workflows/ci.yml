name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  backend:
    name: Rust workspace (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test (backend, core, SDK and CLI; includes the OpenAPI drift check)
        run: cargo test --locked --workspace

  coverage:
    name: Rust coverage (llvm-cov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: coverage
      # Runs the whole test suite instrumented; fails if line coverage drops
      # below the floor (measured at ~91% when it was set).
      - name: Test with coverage
        run: cargo llvm-cov --locked --workspace --fail-under-lines 88 --lcov --output-path lcov.info
      - name: Summary
        run: cargo llvm-cov report --summary-only
      - uses: actions/upload-artifact@v7
        with:
          name: rust-coverage
          path: lcov.info
          retention-days: 14

  backend-msrv:
    name: Rust workspace (MSRV build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --workspace --all-targets

  supply-chain:
    name: Supply chain (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: Cargo.toml
          command: check advisories bans licenses sources

  openapi:
    name: OpenAPI document (lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # The Rust tests check that docs/api/openapi.json matches the code; this
      # checks the document itself against the OpenAPI 3.1 specification.
      - run: npx --yes @redocly/cli@1.34.5 lint docs/api/openapi.json

  frontend:
    name: Frontend (check, unit, build, e2e)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Audit (production + dev dependencies)
        run: pnpm audit --audit-level=moderate
      - name: Type check
        run: pnpm check
      - name: Unit tests (with a coverage floor, see vite.config.ts)
        run: pnpm test:coverage
      - name: Build
        run: pnpm build
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end tests
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: frontend/test-results/
          retention-days: 7

  fullstack:
    name: Full stack (real backend, browser TFHE)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: fullstack
      - name: Build backend
        run: cargo build --locked -p he-backend
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browser
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium
      - name: Register, generate keys in the browser, compute on the server
        working-directory: frontend
        env:
          HEAAS_BACKEND_BIN: ../target/debug/he-backend
        run: pnpm test:e2e:fullstack
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: fullstack-report
          path: |
            frontend/test-results/fullstack/
            frontend/e2e-fullstack/.backend.log
          retention-days: 7

  docker:
    name: Docker (lint, build, run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile
      - uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: frontend/Dockerfile
      - uses: docker/setup-buildx-action@v4
      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: heaas-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: frontend
          push: false
          load: true
          tags: heaas-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      # Run both the way compose does: read-only root, no capabilities, as the
      # images' non-root users. Health comes from the images' own HEALTHCHECKs.
      - name: Containers start healthy and unprivileged
        run: |
          set -eu
          hardened="--read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges --health-interval 2s"
          docker run -d --name backend $hardened \
            -e JWT_SECRET=ci-secret-that-is-at-least-32-bytes-long \
            -e APP_BASE_URL=http://localhost:3000 heaas-backend:ci
          docker run -d --name frontend $hardened heaas-frontend:ci
          for c in backend frontend; do
            for _ in $(seq 1 60); do
              status=$(docker inspect --format '{{.State.Health.Status}}' "$c")
              [ "$status" = healthy ] && break
              sleep 2
            done
            docker logs "$c" | tail -20
            [ "$status" = healthy ] || { echo "$c is $status"; exit 1; }
          done
          [ "$(docker inspect --format '{{.Config.User}}' heaas-backend:ci)" = 65532:65532 ]
          [ "$(docker inspect --format '{{.Config.User}}' heaas-frontend:ci)" = node ]
          docker exec backend he-backend backup /data/backup-ci

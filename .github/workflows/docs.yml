# Documentation site: https://yog-sotho.github.io/Homomorphic-Encryption-Service/
#
# Pull requests that touch the docs get a strict build (broken links fail it);
# pushes to master deploy the site to GitHub Pages. The API reference page is
# rendered from docs/api/openapi.json (which the Rust tests keep in step with the
# code) by Redocly before MkDocs runs.
# One-time setup: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Docs

on:
  push:
    branches: [master]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push waits instead of cancelling a deployment midway.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build docs (strict)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install MkDocs
        run: pip install --quiet -r requirements-docs.txt

      - name: Render the API reference
        run: >
          npx --yes @redocly/cli@1.34.5 build-docs docs/api/openapi.json
          -o docs/api/reference.html --title "HE Engine API reference" --disableGoogleFont

      - name: Build the site (fails on broken links)
        run: mkdocs build --strict

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: site/

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

# HE Engine behind nginx: TLS termination, the app under /heaas/, the API under /api/.
#
# Before enabling: set server_name and point ssl_certificate(_key) at your
# certificate (for example from certbot). Sessions use `Secure` cookies, so the
# app must be served over HTTPS.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Let certificate renewals (HTTP-01 challenges) through; everything else
    # moves to HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;
    root /var/www/html;
    index index.html;

    ssl_certificate     /etc/ssl/heaas/fullchain.pem;
    ssl_certificate_key /etc/ssl/heaas/privkey.pem;
    # Mozilla "intermediate" profile.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:HEAAS:10m;
    ssl_session_tickets off;

    # nginx drops these if a location adds headers of its own, so no location
    # below uses add_header. The app and the API set their own CSP and
    # cross-origin isolation headers.
    # Add `; includeSubDomains` only if every subdomain is HTTPS-only.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /downloads/ {
        alias /var/www/downloads/;
        autoindex off;
    }

    location /.assets/ {
        alias /var/www/html/.assets/;
        expires 1y;
        access_log off;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        # Compressed TFHE server keys are ~60 MB, ~106 MB with compression keys
        # (backend MAX_SERVER_KEY_BYTES = 128 MiB).
        client_max_body_size 136m;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Appends the client address. The backend believes only the hops added
        # by addresses in its TRUSTED_PROXIES, so clients cannot spoof theirs.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
    }

    location /heaas/ {
        # The app is built with paths.base=/heaas, so keep the prefix.
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
